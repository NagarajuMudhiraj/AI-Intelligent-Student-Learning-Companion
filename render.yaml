services:
  - type: web
    name: ai-student-companion-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        value: "mongodb://localhost:27017"
      - key: DATABASE_NAME
        value: "aistudentdb"
      - key: CORS_ORIGINS
        value: "*"
