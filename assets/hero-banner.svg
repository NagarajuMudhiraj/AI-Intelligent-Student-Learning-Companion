<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" fill="url(#bg-grad)" />

  <!-- Ambient Light Gradients -->
  <rect width="1200" height="520" fill="url(#glow-cyan)" />
  <rect width="1200" height="520" fill="url(#glow-purple)" />
  <rect width="1200" height="520" fill="url(#glow-blue)" />

  <!-- Subtle Tech Grid -->
  <rect width="1200" height="520" fill="url(#grid-pattern)" />

  <!-- Outer Canvas Border -->
  <rect x="1" y="1" width="1198" height="518" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- TOP HEADER SECTION -->
  <g transform="translate(60, 48)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="410" height="32" rx="16" fill="url(#badge-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <circle cx="16" cy="16" r="9" fill="#38bdf8" fill-opacity="0.25" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1">
      NEXT-GEN ACADEMIC COPILOT • RAG &amp; VECTOR SEARCH
    </text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      AI Intelligent Student Learning Companion
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Transform dense textbooks, lecture decks &amp; PDF notes into conversational AI chats, adaptive quizzes, and 3D flashcards.
    </text>
  </g>

  <!-- THREE FEATURE HIGHLIGHT CARDS -->
  <g transform="translate(60, 195)">
    <!-- Card 1: Smart Document RAG -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="338" height="195" rx="16" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.2" />
      <!-- Card Header Accent -->
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" />
      <text x="40" y="46" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="20" text-anchor="middle">📚</text>
      
      <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
        Multi-Doc RAG Engine
      </text>
      <text x="72" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">
        ChromaDB • Gemini Embedding 2
      </text>

      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Ingests PDF, DOCX, PPTX &amp; TXT
      </text>
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • 3072-dim semantic vector retrieval
      </text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Exact textbook page &amp; slide citations
      </text>

      <!-- Mini tag -->
      <rect x="20" y="152" width="108" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-opacity="0.4" />
      <text x="74" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">
        Ground Truth RAG
      </text>
    </g>

    <!-- Card 2: AI Study Chat & Memory -->
    <g transform="translate(366, 0)" filter="url(#shadow)">
      <rect width="338" height="195" rx="16" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.2" />
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-opacity="0.5" />
      <text x="40" y="46" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="20" text-anchor="middle">🤖</text>

      <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
        Conversational Copilot
      </text>
      <text x="72" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#c084fc">
        Google Gemini 3.5 • LangChain
      </text>

      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Step-by-step problem solver
      </text>
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Semantic caching for low-latency responses
      </text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Full session memory &amp; history search
      </text>

      <rect x="20" y="152" width="102" height="24" rx="12" fill="#6d28d9" fill-opacity="0.3" stroke="#a855f7" stroke-opacity="0.4" />
      <text x="71" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe" text-anchor="middle">
        Semantic Cache
      </text>
    </g>

    <!-- Card 3: Active Recall, Quizzes & Flashcards -->
    <g transform="translate(732, 0)" filter="url(#shadow)">
      <rect width="348" height="195" rx="16" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.2" />
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5" />
      <text x="40" y="46" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="20" text-anchor="middle">📝</text>

      <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
        Active Recall &amp; Testing
      </text>
      <text x="72" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#34d399">
        Adaptive Quizzes • 3D Cards
      </text>

      <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Bloom's taxonomy difficulty tuning
      </text>
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • Interactive 3D flip card memorization
      </text>
      <text x="20" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
        • AI revision timetables &amp; career roadmap
      </text>

      <rect x="20" y="152" width="118" height="24" rx="12" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.4" />
      <text x="79" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">
        Spaced Repetition
      </text>
    </g>
  </g>

  <!-- BOTTOM TECH STACK ROW -->
  <g transform="translate(60, 435)">
    <!-- Tech Pills -->
    <rect x="0" y="0" width="1080" height="48" rx="14" fill="#0b1329" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    
    <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      POWERED BY:
    </text>

    <!-- Badges -->
    <g transform="translate(130, 10)">
      <rect x="0" y="0" width="128" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="64" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Google Gemini 3.5</text>
    </g>

    <g transform="translate(268, 10)">
      <rect x="0" y="0" width="86" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="43" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">LangChain</text>
    </g>

    <g transform="translate(364, 10)">
      <rect x="0" y="0" width="84" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">ChromaDB</text>
    </g>

    <g transform="translate(458, 10)">
      <rect x="0" y="0" width="76" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="38" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">FastAPI</text>
    </g>

    <g transform="translate(544, 10)">
      <rect x="0" y="0" width="84" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">React 19</text>
    </g>

    <g transform="translate(638, 10)">
      <rect x="0" y="0" width="94" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="47" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">TypeScript</text>
    </g>

    <g transform="translate(742, 10)">
      <rect x="0" y="0" width="70" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="35" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Docker</text>
    </g>

    <g transform="translate(822, 10)">
      <rect x="0" y="0" width="86" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="43" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">PWA Ready</text>
    </g>

    <!-- Architecture Live Indicator Link -->
    <g transform="translate(922, 10)">
      <rect x="0" y="0" width="144" height="28" rx="8" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.6" />
      <circle cx="16" cy="14" r="4" fill="#34d399" />
      <text x="80" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">LIVE ARCHITECTURE</text>
    </g>
  </g>
</svg>
