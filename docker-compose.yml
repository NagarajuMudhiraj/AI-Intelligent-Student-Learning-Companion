version: '3.8'

services:
  # FastAPI AI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-companion-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI Student Companion
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=aistudentdb
      - SECRET_KEY=${SECRET_KEY:-companion_super_secret_jwt_key_2026_dev}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      - mongodb

  # React 19 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    container_name: student-companion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Containerized MongoDB Service
  mongodb:
    image: mongo:6-jammy
    container_name: student-companion-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  chroma_data:
    driver: local
  mongo_data:
    driver: local
